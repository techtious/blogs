{{ define "main" }}
<div class="search-page">
  <h1 class="search-page-title">Search</h1>
  <div id="search"></div>
</div>

<link href="/pagefind/pagefind-ui.css" rel="stylesheet">
<script src="/pagefind/pagefind-ui.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function() {
    new PagefindUI({
      element: '#search',
      showSubResults: true,
      showImages: false,
      excerptLength: 20,
      resetStyles: false
    });
  });
</script>
{{ end }}
