{{ define "main" }}
  <article>
    {{ with .Content }}
    <section class="cf ph3 ph5-l pv2 f5 tc-l center measure-wide lh-copy nested-links {{ $.Param "text_color" | compare.Default "mid-gray" }}">
      {{- . -}}
    </section>
    {{ end }}
    <section class="post-grid">
      {{ range .Paginator.Pages }}
        <div>
          {{ .Render "summary" }}
        </div>
      {{ end }}
    </section>
    {{- template "_internal/pagination.html" . -}}
  </article>
{{ end }}
